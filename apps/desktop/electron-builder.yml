# Packages the app as a Windows installer and publishes it to GitHub Releases,
# where the in-app Update button looks for new versions. Everything the app
# needs is bundled into dist/, so no node_modules ship with it.
# The appId is from before the app was renamed to Foreus. It must not change:
# the installer and Windows use it to recognize an existing install, so it can
# update in place.
appId: com.lossa551.projectcollaborationtool
productName: Foreus
copyright: Copyright © 2026 lossa551

directories:
  output: release
  # icon.ico (installer, .exe, shortcuts) comes from here; see scripts/icons.mjs.
  buildResources: build

files:
  - dist/**
  - package.json
  - '!dist/**/*.map'
npmRebuild: false
# Claude Code runs the agent hook script with Electron as Node, from disk.
asarUnpack:
  - dist/pct-hook.cjs

win:
  target: nsis
  icon: build/icon.ico
  artifactName: Foreus-Setup-${version}.${ext}

# One click: installs for the current user without admin rights, then opens.
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  shortcutName: Foreus

publish:
  provider: github
  owner: lossa551
  repo: ProjectCollaborationTool
  releaseType: release

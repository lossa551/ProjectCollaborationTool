name: CI

on:
  push:
    branches: [main, beta]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Tests and builds do not launch Electron, so skip its download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Builds the Windows installer so it can be tried from any PR or from beta:
  # download it from the run's artifacts. Publishing happens in release.yml.
  installer:
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A build from CI is a test build (0.x.0-ci.N): it does not update on its
      # own, so the app stays on it until you press Update (see docs/releasing.md).
      - name: Mark the build as a test build
        shell: bash
        run: |
          base=$(node -p "require('./apps/desktop/package.json').version.split('.').slice(0, 2).join('.')")
          npm version "$base.0-ci.$GITHUB_RUN_NUMBER" --no-git-tag-version -w @pct/desktop
      - run: npm run package -w @pct/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error
